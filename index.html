<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365 Sorrisos - 1 Aninho do Isaac</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fef9c3 0%, #e0f2fe 50%, #ffedd5 100%);
            color: #334155;
            line-height: 1.6;
            padding: 25px 15px;
            min-height: 100vh;
        }

        .site-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 40px;
            box-shadow: 0 20px 45px rgba(2, 132, 199, 0.15);
            border: 8px solid #bae6fd;
            text-align: center;
        }

        /* Cabeçalho Temático Inspirado na Arte */
        .hero {
            background: linear-gradient(180deg, #e0f2fe 0%, #fef9c3 100%);
            color: #1e293b;
            text-align: center;
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            border: 4px solid #ffffff;
            position: relative;
        }

        /* Sol Sorridente no Topo */
        .sol-arte {
            font-size: 3.5rem;
            margin-bottom: -10px;
            display: inline-block;
            animation: flutuar 3s ease-in-out infinite;
        }

        @keyframes flutuar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .tag-festa {
            display: inline-block;
            background-color: #ffffff;
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 800;
            color: #0284c7;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border: 2px solid #bae6fd;
        }

        .hero h1 {
            font-size: 3.2rem;
            margin-bottom: 10px;
            color: #0284c7;
            font-weight: 900;
            text-shadow: 2px 2px 0px #ffffff;
            letter-spacing: -1px;
        }

        .hero h1 span.num-365 {
            color: #f59e0b;
        }

        .hero p {
            font-size: 1.15rem;
            margin-bottom: 25px;
            color: #475569;
            font-weight: 600;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Moldura da Foto do Isaac */
        .foto-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid #ffffff;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
            background-color: #fef08a;
        }

        .foto-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
