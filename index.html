<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365 Sorrisos - 1 Aninho do Isaac</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #e0f2fe 100%);
            color: #475569;
            line-height: 1.6;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .site-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(251, 191, 36, 0.2);
            border: 6px solid #fde047;
            text-align: center;
        }

        /* Cabeçalho festivo com carinha de sol */
        .hero {
            background: linear-gradient(135deg, #fde047 0%, #38bdf8 100%);
            color: #1e293b;
            text-align: center;
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            border: 4px solid #ffffff;
        }

        .tag-festa {
            display: inline-block;
            background-color: #ffffff;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 800;
            color: #d97706;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: #1e3a8a;
            font-weight: 900;
            text-shadow: 2px 2px 0px #ffffff;
        }

        .hero p {
            font-size: 1.15rem;
            margin-bottom: 20px;
            color: #1e293b;
            font-weight: 600;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Foto da Criança em Destaque */
        .foto-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background-color: #e0f2fe;
        }

        .foto-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Contador Regressivo em tons alegres */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .countdown-box {
            background: #ffffff;
            border: 2px solid #38bdf8;
            padding: 10px;
            border-radius: 14px;
            min-width: 65px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .countdown-box span {
            display: block;
            font-size: 1.3rem;
            font-weight: 900;
            color: #0284c7;
        }

        .countdown-box small {
            font-size: 0.7rem;
            color: #64748b;
            font-weight: bold;
            text-transform: uppercase;
        }

        .data-badge {
            background-color: #fef9c3;
            color: #854d0e;
            border: 2px dashed #facc15;
            padding: 10px 18px;
            border-radius: 14px;
            display: inline-block;
            font-weight: bold;
            font-size: 0.95rem;
        }
