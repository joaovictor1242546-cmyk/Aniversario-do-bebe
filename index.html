
    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365 Sorrisos - 1 Aninho do Isaac</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fef9c3 0%, #e0f2fe 100%);
            color: #334155;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 6px solid #bae6fd;
            text-align: center;
        }
        h1 {
            color: #0284c7;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .sol {
            font-size: 3rem;
        }
        .tag {
            background: #fef08a;
            color: #d97706;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        .box {
            background: #f0fdf4;
            border: 2px solid #4ade80;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }
        input {
            width: 80%;
            padding: 12px;
            border: 2px solid #bae6fd;
            border-radius: 25px;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 10px;
            outline: none;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #0369a1;
        }
        #msg {
            display: none;
            margin-top: 15px;
            color: #15803d;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sol">☀️</div>
        <span class="tag">1 Aninho do Isaac • 12 de Dezembro</span>
        <h1>365 Sorrisos</h1>
        <p>Cada dia ao lado do Isaac foi repleto de alegria. Vamos celebrar juntos!</p>

        <div class="box">
            <h3>Confirme sua Presença</h3>
            <p>Digite seu nome abaixo:</p>
            <div id="formPresenca">
                <input type="text" id="nome" placeholder="Seu nome completo...">
                <br>
                <button onclick="confirmar()">Sim, eu vou! 💛</button>
            </div>
            <div id="msg">
                Oba, <span id="nomeUser"></span>! Agradecemos a sua confirmação. Contamos com você! ✨
            </div>
        </div>

        <div style="margin-top: 20px; font-size: 0.9rem; color: #64748b;">
            <p>👕 <strong>Roupas:</strong> Sugerimos tamanho 2 anos.</p>
            <p>👟 <strong>Calçados:</strong> Tamanho 19.</p>
        </div>
    </div>

    <script>
        function confirmar() {
            var nome = document.getElementById('nome').value.trim();
            if (nome === "") {
                alert("Por favor, digite o seu nome!");
                return;
            }
            document.getElementById('formPresenca').style.display = 'none';
            document.getElementById('nomeUser').innerText = nome;
            document.getElementById('msg').style.display = 'block';
        }
    </script>

</body>
</html>
